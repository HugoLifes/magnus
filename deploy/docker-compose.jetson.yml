# Magnus en un Jetson Orin (probado en Orin Nano Super 8 GB, JetPack 6.2).
#
# Dos servicios, convención de la organización "nim_" + nombre:
#   nim_ollama  — inferencia en la GPU del Jetson. Imagen OFICIAL de Ollama: su
#                 build arm64 trae cuda_jetpack5 y cuda_jetpack6 y detecta el
#                 Orin como iGPU (comprobado con 0.34.0 en JetPack 6.2). La de
#                 dustynv se quedó en Ollama 0.6.8 y no descarga qwen3 ni
#                 modelos posteriores.
#   nim_magnus  — daemon (API local), sin GPU
#
# Memoria: CPU y GPU comparten 7.4 GiB. Si otro contenedor pesado corre en el
# mismo equipo, un modelo grande puede colgar el Jetson ENTERO, no solo el
# contenedor. Magnus se niega a cargar lo que no cabe en la memoria libre y, antes
# de cargar, desaloja la caché de páginas para que CUDA pueda reservar (ver
# core/reclaim.py).
#
# Uso:  docker compose -f deploy/docker-compose.jetson.yml up -d --build

name: magnus

services:
  nim_ollama:
    # Versión fijada: subirla es una decisión, no un efecto de `pull`.
    image: ollama/ollama:0.34.0
    container_name: nim_ollama
    runtime: nvidia
    restart: unless-stopped
    # Sin `command`: el ENTRYPOINT de la imagen ya es `ollama` y su CMD `serve`.
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/data/models/ollama
      # Un modelo a la vez: en 8 GB compartidos no caben dos.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      # Recargar cuesta ~2.5 s y exige liberar caché; se mantiene 30 min.
      - OLLAMA_KEEP_ALIVE=30m
      # Desde 0.2x el contexto por defecto es automático y crece con la memoria
      # que Ollama cree tener; en memoria compartida conviene fijarlo.
      - OLLAMA_CONTEXT_LENGTH=4096
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/data/models/ollama

  nim_magnus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jetson
    container_name: nim_magnus
    restart: unless-stopped
    depends_on:
      - nim_ollama
    environment:
      - MAGNUS_OLLAMA_URL=http://nim_ollama:11434
      # Conversaciones, medidor y ajustes: en el volumen, sobreviven al contenedor.
      - MAGNUS_HOME=/app/data
      # Docker oculta /sys/firmware: sin este montaje el daemon no sabe que
      # corre en un Jetson y /hardware sale vacío.
      - MAGNUS_DEVICE_TREE_MODEL=/run/magnus/device-tree-model
    # Solo loopback. Desde la PC: ssh -L 8420:localhost:8420 usuario@jetson
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - magnus-data:/app/data
      - /proc/device-tree/model:/run/magnus/device-tree-model:ro
    # El daemon usa ~50 MiB, pero al liberar caché escribe temporalmente tanta
    # memoria como el modelo va a necesitar; con 512 MiB el kernel lo mataría.
    mem_limit: 4g

volumes:
  ollama-models:
  magnus-data:
