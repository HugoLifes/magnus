# Magnus en un host Linux con GPU NVIDIA dedicada: PC con RTX, estación de
# trabajo o servidor (x86_64 o Grace/arm64). Para Jetson usa
# docker-compose.jetson.yml.
#
# Dos servicios, convención de la organización "nim_" + nombre del proyecto.
# Ejecutar solo en servidores autorizados.
#   nim_ollama  — inferencia en la GPU (imagen oficial de Ollama, versión fijada)
#   nim_magnus  — daemon (API local)
#
# Requisitos del host: Docker + NVIDIA Container Toolkit.
# Uso:  docker compose -f deploy/docker-compose.yml up -d --build

name: magnus

services:
  nim_ollama:
    image: ollama/ollama:0.34.0
    container_name: nim_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/data/models/ollama
      # En GPU dedicada caben varios modelos; sube estos valores en multi-GPU.
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_KEEP_ALIVE=30m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/data/models/ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all              # todas las GPUs; Ollama reparte capas entre ellas
              capabilities: [gpu]

  nim_magnus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nim_magnus
    restart: unless-stopped
    depends_on:
      - nim_ollama
    environment:
      - MAGNUS_OLLAMA_URL=http://nim_ollama:11434
      - MAGNUS_HOME=/app/data
    # Solo loopback. Para exponerlo a la red: `magnus token new` dentro del
    # contenedor (o MAGNUS_API_TOKEN) y publica "8420:8420" detrás de un firewall.
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - magnus-data:/app/data         # conversaciones, skills, agentes, documentos
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all              # para leer uso, W y °C con nvidia-smi
              capabilities: [gpu]

volumes:
  ollama-models:
  magnus-data:
