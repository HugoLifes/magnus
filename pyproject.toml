[project]
name = "magnus"
version = "0.9.0b1"
description = "Magnus — SO de agentes local-first sobre hardware NVIDIA. Núcleo en Python; clientes (CLI, Flutter) hablan por una API local."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Encabezados de las skills y definiciones de agentes.
    "pyyaml>=6.0",
    # Claves de proveedores en el llavero del sistema (con respaldo en archivo).
    "keyring>=25",
    # Verificar la firma Ed25519 de las licencias sin internet (core/license.py).
    "cryptography>=43",
]

[project.optional-dependencies]
# Backends de inferencia. Se instalan según el hardware de destino.
# vllm/trtllm requieren GPU NVIDIA + CUDA y NO se instalan en una laptop de dev.
serve = ["vllm>=0.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
magnus = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "daemon", "cli", "cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# Typer y FastAPI declaran parámetros con llamadas en los valores por defecto:
# es su API, no un default mutable compartido.
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends"]
