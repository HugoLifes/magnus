  <rect x="28" y="36" width="8" height="20" rx="2" fill="#F2B441"/>
  <rect x="40" y="22" width="8" height="34" rx="2" fill="#7C6CF6"/>
  <rect x="52" y="8"  width="8" height="48" rx="2" fill="#7C6CF6"/>
</svg>
